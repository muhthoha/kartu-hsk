<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://n8n.zenta.web.id; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>Verifikasi email · Zenta 汉</title>
<script>try{var _t=localStorage.getItem("ui_tema");if(_t==="terang")document.documentElement.setAttribute("data-theme","light");else if(_t==="gelap")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<style>
:root{color-scheme:dark;--bg:#121214;--card:#1C1C20;--ink:#F0F0F3;--mute:#A0A1AB;--line:#2E2F36;--soft:#26262B;--ok:#4CC58A;--okink:#0B1A12;--btn:#F0F0F3;--btnink:#121214;--fi:#0B1A12;--gop:.2;--e1:#4CC58A;--e1t:#183326;--e1d:#7ED9A6;--e2:#6A9BFF;--e2t:#172745;--e2d:#8FB5FF;--e3:#D9A441;--e3t:#382C14;--e3d:#E8BC62;--e1:#4CC58A;--e2:#6A9BFF;--e3:#D9A441;--e4:#F2704F;--e5:#8DA0B5;--e4t:#3A1D17;--e4d:#FF9B83;--e5:#8DA0B5;--e5t:#232B35;--e5d:#B4C2D3;--f1:var(--e1);--f2:var(--e2);--f3:var(--e3);--f4:var(--e4);--err:#FF9B83}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#F4F4F5;--card:#FFFFFF;--ink:#1A1A1F;--mute:#5F6068;--line:#DEDFE3;--soft:#E9E9EC;--ok:#1E6B43;--okink:#FFFFFF;--btn:#1A1A1F;--btnink:#FFFFFF;--fi:#FFFFFF;--gop:.13;--e1:#2F8A5B;--e1t:#DDEFE3;--e1d:#1E6B43;--e2:#2F6BDA;--e2t:#DEE8FB;--e2d:#1F4FB0;--e3:#B07A12;--e3t:#F6E9CC;--e3d:#7F5508;--e1:#2F8A5B;--e2:#2F6BDA;--e3:#B07A12;--e4:#D2452B;--e5:#596B80;--e4t:#FADFD8;--e4d:#A52F18;--e5:#596B80;--e5t:#E3E8EE;--e5d:#3B4A5C;--f1:var(--e1d);--f2:var(--e2d);--f3:var(--e3d);--f4:var(--e4d);--err:#A52F18}}
:root[data-theme="light"]{color-scheme:light;--bg:#F4F4F5;--card:#FFFFFF;--ink:#1A1A1F;--mute:#5F6068;--line:#DEDFE3;--soft:#E9E9EC;--ok:#1E6B43;--okink:#FFFFFF;--btn:#1A1A1F;--btnink:#FFFFFF;--fi:#FFFFFF;--gop:.13;--e1:#2F8A5B;--e1t:#DDEFE3;--e1d:#1E6B43;--e2:#2F6BDA;--e2t:#DEE8FB;--e2d:#1F4FB0;--e3:#B07A12;--e3t:#F6E9CC;--e3d:#7F5508;--e1:#2F8A5B;--e2:#2F6BDA;--e3:#B07A12;--e4:#D2452B;--e5:#596B80;--e4t:#FADFD8;--e4d:#A52F18;--e5:#596B80;--e5t:#E3E8EE;--e5d:#3B4A5C;--f1:var(--e1d);--f2:var(--e2d);--f3:var(--e3d);--f4:var(--e4d);--err:#A52F18}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;padding:20px 16px;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.box{width:100%;max-width:380px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px 24px;text-align:center}
h1{color:var(--ink);font-size:46px;line-height:1.1;margin:0}
.zl{display:inline-grid;grid-template-columns:auto auto;justify-content:start;align-items:center;column-gap:.14em;row-gap:.2em;font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:-.02em;line-height:1;white-space:nowrap}.zl i{font-style:normal;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-weight:700;letter-spacing:0}.zl::after{content:"";grid-column:1/-1;height:max(.11em,3px);background:linear-gradient(var(--e1),var(--e1)) 0% 0/calc((100% - .36em)/5) 100% no-repeat,linear-gradient(var(--e2),var(--e2)) 25% 0/calc((100% - .36em)/5) 100% no-repeat,linear-gradient(var(--e3),var(--e3)) 50% 0/calc((100% - .36em)/5) 100% no-repeat,linear-gradient(var(--e4),var(--e4)) 75% 0/calc((100% - .36em)/5) 100% no-repeat,linear-gradient(var(--e5),var(--e5)) 100% 0/calc((100% - .36em)/5) 100% no-repeat}
.el{display:flex;gap:7px;justify-content:center;margin:12px 0 4px}.el span{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:700 16px 'Noto Serif SC',serif}
.el span:nth-child(1){background:var(--e1t);color:var(--e1d)}.el span:nth-child(2){background:var(--e2t);color:var(--e2d)}.el span:nth-child(3){background:var(--e3t);color:var(--e3d)}.el span:nth-child(4){background:var(--e4t);color:var(--e4d)}.el span:nth-child(5){background:var(--e5t);color:var(--e5d)}
.sub{letter-spacing:.04em;font-size:13px;color:var(--mute);margin-top:8px}
p{line-height:1.55;margin:18px 0 0;font-size:15px;overflow-wrap:anywhere}
#em{font-weight:600}
#st{min-height:1.4em}#st.ok{color:var(--ok)}#st.err{color:var(--err)}
.btn{display:inline-block;margin-top:20px;padding:14px 24px;border-radius:14px;border:0;background:var(--btn);color:var(--btnink);font:600 15px Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:default}
.btn[hidden]{display:none}
</style></head><body>
<div class="box"><h1><span class="zl">Zenta<i lang="zh">汉</i></span></h1><div class="el" aria-hidden="true"><span>木</span><span>水</span><span>土</span><span>火</span><span>金</span></div><div class="sub">Verifikasi email</div>
<p id="t">Memeriksa tautan…</p><p id="em" hidden></p>
<p id="st" role="status" aria-live="polite"></p>
<button class="btn" id="go" type="button" hidden>Verifikasi sekarang</button>
<a class="btn" id="in" href="./" hidden>Ke halaman masuk</a>
</div>
<script>
(function(){
 var URL_V="https://n8n.zenta.web.id/webhook/hsk-verif";
 var $=function(i){return document.getElementById(i)},t=$("t"),em=$("em"),st=$("st"),go=$("go"),lnk=$("in");
 function say(c,s){st.className=c||"";st.textContent=s||""}
 var tok="",email="";
 try{
  var p=new URLSearchParams(location.hash.replace(/^#/,""));
  tok=String(p.get("verif")||"").trim().toLowerCase();email=String(p.get("email")||"").trim().toLowerCase();
  history.replaceState(null,"",location.pathname);   /* token tidak tertinggal di bilah alamat / riwayat */
 }catch(e){}
 if(!/^[0-9a-f]{32}$/.test(tok)||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||email.length>120){
  t.textContent="Tautan verifikasi tidak lengkap atau rusak. Buka tautan langsung dari email, atau masuk untuk meminta tautan baru.";
  lnk.hidden=false;return;
 }
 t.textContent="Konfirmasi bahwa email berikut milikmu:";em.textContent=email;em.hidden=false;go.hidden=false;
 var busy=false;
 go.addEventListener("click",function(){
  if(busy)return;busy=true;go.disabled=true;go.textContent="Memproses…";say("","");
  var ctl=typeof AbortController!=="undefined"?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort()},20000),done=false;
  fetch(URL_V,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email,token:tok}),mode:"cors",signal:ctl?ctl.signal:undefined})
   .then(function(r){return r.json().then(function(j){return{s:r.status,j:j}},function(){return{s:r.status,j:null}})})
   .then(function(x){
    if(x.j&&x.j.ok===true){done=true;t.textContent="Email berhasil diverifikasi.";em.hidden=true;go.hidden=true;say("ok",(x.j.info?String(x.j.info).slice(0,200)+" ":"")+"Sekarang kamu bisa masuk.");lnk.hidden=false}
    else if(x.s===400||x.s===429){done=true;go.hidden=true;lnk.hidden=false;say("err",(x.j&&x.j.pesan)||"Tautan tidak valid.")}
    else say("err","Gagal ("+x.s+"). Coba lagi sebentar lagi.");
   })
   .catch(function(){say("err","Tidak bisa terhubung ke server. Periksa koneksi lalu coba lagi.")})
   .then(function(){clearTimeout(to);busy=false;if(!done){go.disabled=false;go.textContent="Verifikasi sekarang"}});
 });
})();
</script></body></html>
